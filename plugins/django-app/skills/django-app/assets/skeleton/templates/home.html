{% extends "base.html" %}
{% block content %}
  <h1 class="text-2xl font-semibold">{{ PRODUCT_NAME }}</h1>
  {% if user.is_authenticated %}
    <p class="mt-2">Signed in as {{ user.email }}.</p>
    <form method="post" action="{% url 'account_logout' %}" class="mt-4">{% csrf_token %}
      <button class="rounded bg-gray-900 px-3 py-2 text-white">Sign out</button>
    </form>
  {% else %}
    <p class="mt-4"><a class="underline" href="{% url 'account_login' %}">Sign in</a></p>
  {% endif %}
{% endblock %}
