repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      # Rule selection lives in pyproject.toml. Don't pass `--select=I, E, F` here:
      # YAML splits on the spaces and ruff silently runs isort only.
      - id: ruff
        args: [--fix]
      - id: ruff-format
