# Push to `test` → CI gate → build → GHCR (:test and :test-<sha>) → SSH deploy → migrate → verify.
# This is the only workflow that builds. Prod promotes the digest built here (deploy-prod.yml).
#
# Repo settings — variables: SERVER_HOST, SERVER_USER; secrets: SERVER_SSH_KEY, GHCR_PAT.
name: Deploy to Test

on:
  push:
    branches: [test]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_NAME: myapp

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Full sha: deploy-prod resolves :test-$GITHUB_SHA.
          tags: |
            type=raw,value=test
            type=sha,prefix=test-,format=long
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy, migrate, verify
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/devmo/apps
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            just update-${{ env.APP_NAME }}-test
            APP=${{ env.APP_NAME }}-test-app
            # [tenant]
            docker exec $APP python manage.py migrate --database=admin
            docker exec $APP python manage.py check --deploy --database default
            # [/tenant]
            # [!tenant]
            docker exec $APP python manage.py migrate
            docker exec $APP python manage.py check --deploy
            # [/!tenant]
            # A deploy that doesn't answer /ht/ is a failed deploy, whatever the steps above said.
            for i in $(seq 1 30); do
              docker exec $APP curl -fsS http://127.0.0.1:8000/ht/ && exit 0
              sleep 2
            done
            docker logs --tail 100 $APP
            exit 1

      - name: Summary
        run: |
          echo "## Deployed to test" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
