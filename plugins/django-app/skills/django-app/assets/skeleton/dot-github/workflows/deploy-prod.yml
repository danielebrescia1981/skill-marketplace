# Manual: gh workflow run deploy-prod.yml --ref main -f version=vX.Y.Z
#
# Never builds. `qualify` proves the image being released is the one that ran on test
# and changes nothing; `deploy` promotes that exact digest to the version tag, rolls it
# out, verifies it, and only then tags git — so a tag never names a release that didn't ship.
# No :latest anywhere: prod runs a pinned version.
name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (vX.Y.Z)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_NAME: myapp

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
    steps:
      - name: Validate version
        run: |
          [[ "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be vX.Y.Z"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A released version is immutable: re-releasing would change what vX.Y.Z means everywhere it's cited.
      - name: Refuse to re-release a version
        run: |
          if docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:${{ inputs.version }}" >/dev/null 2>&1; then
            echo "FATAL: ${{ inputs.version }} already exists. Release a new version."; exit 1
          fi
      - name: Resolve the image built for this commit on test
        id: resolve
        run: |
          SRC="$REGISTRY/$IMAGE_NAME:test-$GITHUB_SHA"
          if ! docker buildx imagetools inspect "$SRC" >/dev/null 2>&1; then
            echo "FATAL: no test image for $GITHUB_SHA. Merge test into main (not dev), let Deploy to Test finish, retry."
            exit 1
          fi
          # Parse the human-readable output: --format templates have varied across buildx versions.
          DIGEST=$(docker buildx imagetools inspect "$SRC" | awk '/^Digest:/{print $2; exit}')
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "FATAL: bad digest '$DIGEST'"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      # [gxp]
      # The link that makes "validated on test" mean something: test RAN this artefact.
      - name: Confirm test is running this digest
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            for c in ${{ env.APP_NAME }}-test-app ${{ env.APP_NAME }}-test-worker; do
              RUNNING=$(docker image inspect "$(docker inspect $c --format '{{.Image}}')" --format '{{join .RepoDigests ","}}' | tr ',' '\n' | sed -n 's|.*@||p' | head -1)
              [ "$RUNNING" = "${{ steps.resolve.outputs.digest }}" ] || { echo "FATAL: $c runs $RUNNING"; exit 1; }
            done
      # [/gxp]
      - name: Release evidence
        run: |
          {
            echo "## Release candidate ${{ inputs.version }}"
            echo "| | |"; echo "|---|---|"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Qualified image | \`$REGISTRY/$IMAGE_NAME:test-$GITHUB_SHA\` |"
            echo "| Digest | \`${{ steps.resolve.outputs.digest }}\` |"
            echo "| Requested by | @${{ github.actor }} |"
          } >> $GITHUB_STEP_SUMMARY

  deploy:
    needs: qualify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://myapp.com
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the qualified digest (retag, never rebuild)
        run: |
          docker buildx imagetools create -t "$REGISTRY/$IMAGE_NAME:${{ inputs.version }}" \
            "$REGISTRY/$IMAGE_NAME@${{ needs.qualify.outputs.digest }}"

      - name: Deploy, migrate, verify
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/devmo/apps
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            # The compose stack reads APP_VERSION to pick the image tag and to stamp the footer.
            ENV_FILE=/home/devmo/apps/apps/${{ env.APP_NAME }}-prod/.env
            sed -i '/^APP_VERSION=/d' "$ENV_FILE" && echo "APP_VERSION=${{ inputs.version }}" >> "$ENV_FILE"
            just update-${{ env.APP_NAME }}-prod
            APP=${{ env.APP_NAME }}-prod-app
            for c in $APP ${{ env.APP_NAME }}-prod-worker; do
              DIGEST=$(docker image inspect "$(docker inspect $c --format '{{.Image}}')" --format '{{join .RepoDigests ","}}' | tr ',' '\n' | sed -n 's|.*@||p' | head -1)
              [ "$DIGEST" = "${{ needs.qualify.outputs.digest }}" ] || { echo "FATAL: $c runs $DIGEST"; exit 1; }
            done
            [ "$(docker exec $APP printenv APP_VERSION)" = "${{ inputs.version }}" ] || { echo "FATAL: APP_VERSION mismatch"; exit 1; }
            # [tenant]
            docker exec $APP python manage.py migrate --database=admin
            docker exec $APP python manage.py check --deploy --database default
            # [/tenant]
            # [!tenant]
            docker exec $APP python manage.py migrate
            docker exec $APP python manage.py check --deploy
            # [/!tenant]
            for i in $(seq 1 30); do
              docker exec $APP curl -fsS http://127.0.0.1:8000/ht/ && exit 0
              sleep 2
            done
            docker logs --tail 100 $APP
            exit 1

      - name: Tag the release
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          git push origin "${{ inputs.version }}"
